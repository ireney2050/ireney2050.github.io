---
layout: default
---
<main class="project-detail">
  <a href="/#projects" class="back-link">&larr; Back to all projects</a>
  <h1>{{ page.title }}</h1>
  <div class="project-meta">
    {% for tag in page.tags %}
    <span class="tag">{{ tag }}</span>
    {% endfor %}
  </div>
  <div class="content">
    {{ content }}
  </div>
</main>
