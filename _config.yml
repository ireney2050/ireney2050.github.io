# Site settings
title: Irene Yuan | Data & Analytics
description: "Portfolio of Irene Yuan — Data Analyst specialising in customer analytics, BI, and applied AI."
url: "https://ireney2050.github.io"
baseurl: ""

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:path/

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Defaults
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

# Exclude
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
